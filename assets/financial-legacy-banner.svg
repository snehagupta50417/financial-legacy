<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">Financial Legacy</title>
  <desc id="desc">Find what’s yours. Make sure nothing gets left behind. Discover assets, prepare your legacy and navigate claims.</desc>
  <rect width="1400" height="440" rx="16" fill="#F5F2E9"/>
  <path d="M0 16A16 16 0 0 1 16 0H1384A16 16 0 0 1 1400 16V84H0Z" fill="#102E32"/>
  <rect x="48" y="25" width="34" height="34" rx="7" fill="none" stroke="#D6C39A" stroke-width="1.5"/>
